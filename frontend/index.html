<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="DataSentry: data-quality, drift and ML monitoring with lineage-aware incident impact and verified remediation." />
    <meta name="theme-color" content="#090B10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DataSentry</title>
    <script>
      try {
        var t = localStorage.getItem("ds-theme");
        if (t === "light" || (t === "system" && matchMedia("(prefers-color-scheme: light)").matches)) document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
