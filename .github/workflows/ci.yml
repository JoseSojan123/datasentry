name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and SDK
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datasentry
          POSTGRES_PASSWORD: datasentry
          POSTGRES_DB: datasentry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datasentry -d datasentry_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://datasentry:datasentry@localhost:5432/datasentry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            sdk/pyproject.toml
      - name: Install
        run: |
          python -m pip install -e "backend[dev]" -e "sdk[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check . ../scripts ../sdk
      - name: Type check (mypy)
        working-directory: backend
        run: mypy
      - name: Backend tests
        working-directory: backend
        run: pytest -p no:warnings
      - name: SDK tests
        working-directory: sdk
        run: pytest -p no:warnings
      - name: Benchmark smoke run (small)
        working-directory: backend
        run: python ../scripts/benchmark.py --seeds 2 --sensitivity-seeds 2 --model-seeds 2 --scaling 2000 > /dev/null

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Docker stack end to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment file
        run: |
          cp .env.example .env
          sed -i "s|^ENVIRONMENT=.*|ENVIRONMENT=production|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^CORS_ORIGINS=.*|CORS_ORIGINS=http://localhost:8000|" .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300 db api worker
      - name: API end-to-end scenario
        run: python3 scripts/e2e_scenario.py --api http://localhost:8000
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser tests against the container
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
