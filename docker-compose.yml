# Local stack: PostgreSQL, one-off migrations, the API (also serving the web app) and a scheduler worker.
#   cp .env.example .env   # then set SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up --build
#   open http://localhost:8000
# Optional synthetic data and an admin account:
#   SEED_ADMIN_PASSWORD=... docker compose --profile seed run --rm seed --email you@example.com

x-app: &app
  build: .
  image: datasentry:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datasentry}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-datasentry}
    STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datasentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-datasentry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datasentry}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-datasentry}
      STORAGE_DIR: /data/storage
      # The worker service runs scheduled jobs, so the API does not.
      SCHEDULER_MODE: worker
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datasentry}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-datasentry}
      STORAGE_DIR: /data/storage
      SCHEDULER_MODE: worker
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  seed:
    <<: *app
    entrypoint: ["python", "-m", "app.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datasentry}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-datasentry}
      STORAGE_DIR: /data/storage
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    profiles: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
