# Optional: drive DataSentry's scheduled jobs from GitHub when the host cannot run a worker
# (SCHEDULER_MODE=external). Set repository secrets DATASENTRY_URL (e.g. https://your-app.example.com)
# and DATASENTRY_CRON_SECRET (same value as the API's CRON_SECRET). Without them this workflow does nothing.
name: Scheduled jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run-due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger due jobs
        env:
          URL: ${{ secrets.DATASENTRY_URL }}
          SECRET: ${{ secrets.DATASENTRY_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "DATASENTRY_URL or DATASENTRY_CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 240 \
            -X POST -H "X-Cron-Secret: $SECRET" "$URL/api/v1/jobs/run-due"
